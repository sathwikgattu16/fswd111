<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
</head>
<body>

    <h1>Order From Your Phone</h1>
    <p>
        <label for="customer"> Your Name</label>
        <input type="text" id="customer" name="customer">

    </p>
    <p>
        <label for="phone"> Phone No </label>
        <input type="tel" id="phone" name="phone">
        
    </p>
    <fieldset>
        <legend>
            Choose Your Dish
        </legend>
        <input type="radio" id="idli" name="dish" value="idly">
        <label for="idli"> Idly</label>
        <br>
        <input type="radio" id="thali" name="dish" value="veg-thali">
        <label for="thali"> Veg Thali</label>
        <br>
        <input type="radio" id="curd" name="dish" value="curd-rice">
        <label for="idli"> Curd Rice</label>

    </fieldset>
    <p>
        <label for="plates" > How Many Plates</label>
        <input type="number" id="plates" name="plates">

    </p>
    <p>
        <label for="notes" > Anything Else </label>
       <textarea id="notes" name="notes" rows="3" cols="30">

       </textarea>
        
    </p>

    <button> Place Order</button>

    <a href="about.html">About</a>

</body>
</html>
